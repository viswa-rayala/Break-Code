<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .navy { stroke: #10265E; fill: #10265E; }
      .blue { stroke: #2C5CE0; fill: #2C5CE0; }
      .accent { fill: #4E8CFF; }
      .word { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Icon: broken chevron ">" representing break + code -->
  <g transform="translate(30,0)">
    <path d="M75,55 L165,140" class="blue" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M165,160 L75,245" class="navy" stroke-width="36" stroke-linecap="round" fill="none"/>
    <rect x="150" y="132" width="34" height="34" class="accent" transform="rotate(45 167 149)"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="188" font-size="96" class="word navy">break<tspan fill="#2C5CE0">code</tspan></text>
</svg>
