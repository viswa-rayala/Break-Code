<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakCode Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <img class="brand-logo" src="logo.svg" alt="BreakCode">
    <p class="subtitle">Create your account to start coding</p>

    <form id="signupForm">

        <div class="input-group">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="Enter your full name" required autocomplete="name">
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
                <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                    <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-icon eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                        <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="8" autocomplete="new-password">
        </div>
        <!-- <br> -->
        <!-- <label class="remember-me">
            <input type="checkbox" id="terms" required>
            <span>I agree to the terms and conditions</span>
        </label> -->


        <button type="submit" class="login-btn">Create account</button>

        <p class="signup-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

    </form>

    <div id="popup" class="popup hidden" role="alert" aria-live="assertive">
        <div class="popup-card">
            <div class="popup-icon">✓</div>
            <div class="popup-text">
                <h3>Success</h3>
                <p id="popupMessage">Action completed.</p>
            </div>
        </div>
    </div>

</div>

<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeOpen = togglePasswordBtn.querySelector('.eye-open');
    const eyeClosed = togglePasswordBtn.querySelector('.eye-closed');
    const popup = document.getElementById('popup');
    const popupMessage = document.getElementById('popupMessage');

    function showSuccessPopup(message, redirectUrl) {
        popupMessage.textContent = message;
        popup.classList.remove('hidden');
        popup.classList.add('visible');

        setTimeout(() => {
            popup.classList.remove('visible');
            setTimeout(() => {
                popup.classList.add('hidden');
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                }
            }, 250);
        }, 1800);
    }

    togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeOpen.classList.toggle('hidden', isPassword);
        eyeClosed.classList.toggle('hidden', !isPassword);
    });

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        if (passwordInput.value !== document.getElementById('confirmPassword').value) {
            alert('Passwords do not match.');
            return;
        }

        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: passwordInput.value
            })
        });
        const result = await response.json();

        if (response.ok) {
            showSuccessPopup(result.message, 'login.html');
            return;
        }

        alert(result.message);
    });
</script>

</body>
</html>
