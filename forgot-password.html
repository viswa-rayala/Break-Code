<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakCode Forgot Password</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <h1 class="logo">BreakCode</h1>
    <p class="subtitle">Recover your account with an email OTP</p>

    <form id="forgotPasswordForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="otp-section hidden" id="otpSection">
            <div class="input-group">
                <label for="otp">One-time password</label>
                <input type="text" id="otp" placeholder="Enter the 6-digit OTP" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
            </div>

            <p class="otp-message" id="otpMessage" role="status"></p>
        </div>

        <button type="submit" class="login-btn" id="submitButton">Send OTP</button>

        <p class="signup-text">
            Remember your password?
            <a href="login.html">Log In</a>
        </p>

    </form>

</div>

<script>
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const otpSection = document.getElementById('otpSection');
    const otpInput = document.getElementById('otp');
    const otpMessage = document.getElementById('otpMessage');
    const submitButton = document.getElementById('submitButton');
    let otpRequested = false;

    forgotPasswordForm.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!otpRequested) {
            otpRequested = true;
            otpSection.classList.remove('hidden');
            otpInput.required = true;
            submitButton.textContent = 'Verify OTP';
            otpMessage.textContent = `An OTP has been sent to ${emailInput.value}.`;
            otpInput.focus();
            return;
        }

        if (!/^\d{6}$/.test(otpInput.value)) {
            otpMessage.textContent = 'Enter the 6-digit OTP sent to your email.';
            otpInput.focus();
            return;
        }

        otpMessage.textContent = 'OTP verified. You can now reset your password.';
        submitButton.textContent = 'Continue';
    });
</script>

</body>
</html>
