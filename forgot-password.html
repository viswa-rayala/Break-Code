<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakCode Forgot Password</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <img class="brand-logo" src="logo.svg" alt="BreakCode">
    <p class="subtitle">Recover your account with an email OTP</p>

    <form id="forgotPasswordForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="otp-section hidden" id="otpSection">
            <div class="input-group">
                <label for="otp">One-time password</label>
                <input type="text" id="otp" placeholder="Enter the 6-digit OTP" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
            </div>

            <p class="otp-message" id="otpMessage" role="status"></p>
        </div>

        <div class="reset-section hidden" id="resetSection">
            <div class="input-group">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" placeholder="Enter a new password" minlength="8" autocomplete="new-password">
            </div>

            <div class="input-group">
                <label for="confirmNewPassword">Confirm new password</label>
                <input type="password" id="confirmNewPassword" placeholder="Confirm your new password" minlength="8" autocomplete="new-password">
            </div>
        </div>

        <button type="submit" class="login-btn" id="submitButton">Send OTP</button>

        <p class="signup-text">
            Remember your password?
            <a href="login.html">Log In</a>
        </p>

    </form>

</div>

<script>
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const otpSection = document.getElementById('otpSection');
    const otpInput = document.getElementById('otp');
    const otpMessage = document.getElementById('otpMessage');
    const resetSection = document.getElementById('resetSection');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
    const submitButton = document.getElementById('submitButton');
    let otpRequested = false;

    forgotPasswordForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (!otpRequested) {
            const response = await fetch('/api/forgot-password/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput.value })
            });
            const result = await response.json();
            otpMessage.textContent = result.message;

            if (!response.ok) {
                return;
            }

            otpRequested = true;
            otpSection.classList.remove('hidden');
            otpInput.required = true;
            submitButton.textContent = 'Verify OTP';
            otpInput.focus();
            return;
        }

        if (!/^\d{6}$/.test(otpInput.value)) {
            otpMessage.textContent = 'Enter the 6-digit OTP sent to your email.';
            otpInput.focus();
            return;
        }

        if (submitButton.textContent === 'Reset password') {
            if (newPasswordInput.value !== confirmNewPasswordInput.value) {
                otpMessage.textContent = 'Passwords do not match.';
                return;
            }

            const response = await fetch('/api/forgot-password/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput.value, otp: otpInput.value, password: newPasswordInput.value })
            });
            const result = await response.json();
            otpMessage.textContent = result.message;

            if (response.ok) {
                submitButton.disabled = true;
            }
            return;
        }

        const response = await fetch('/api/forgot-password/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput.value, otp: otpInput.value })
        });
        const result = await response.json();
        otpMessage.textContent = result.message;

        if (response.ok) {
            resetSection.classList.remove('hidden');
            newPasswordInput.required = true;
            confirmNewPasswordInput.required = true;
            submitButton.textContent = 'Reset password';
            newPasswordInput.focus();
        }
    });
</script>

</body>
</html>
